<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отслеживание отправлений</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f5f6f8; margin:0; padding:32px 16px; color:#1f2933; }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .hint { font-size: 13px; color: #6b7280; margin: 0 0 16px; }
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input { width:100%; padding:12px 14px; font-size:15px; border:1px solid #d1d5db; border-radius:10px; }
  .search-wrap input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); outline:none; }
  .filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filters button { border:1px solid #d1d5db; background:#fff; padding:6px 12px; border-radius:999px; cursor:pointer; font-size:13px; }
  .filters button.active { background:#2563eb; color:#fff; border-color:#2563eb; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  th, td { text-align:left; padding:12px 14px; font-size:14px; border-bottom:1px solid #eef0f3; vertical-align:top; }
  th { background:#f9fafb; font-weight:600; color:#4b5563; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#fafbfc; }
  .status { display:inline-block; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:500; }
  .status.in-transit { background:#e0f2fe; color:#0369a1; }
  .status.delivered  { background:#dcfce7; color:#15803d; }
  .status.pending    { background:#fef3c7; color:#b45309; }
  .status.unknown    { background:#f3f4f6; color:#4b5563; }
  .map-link { color:#2563eb; text-decoration:none; font-size:13px; }
  .map-link:hover { text-decoration:underline; }
  .empty { padding:24px; text-align:center; color:#6b7280; background:#fff; border-radius:10px; }
  .pagination { display:flex; gap:8px; justify-content:center; margin-top:16px; align-items:center; font-size:13px; color:#6b7280; }
  .pagination button { padding:6px 12px; border:1px solid #d1d5db; background:#fff; border-radius:8px; cursor:pointer; }
  .pagination button:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<div class="container">
  <h1>Отслеживание отправлений</h1>
  <p class="hint">Введите минимум 4 цифры из номера или выберите фильтр по статусу.</p>

  <div class="search-wrap">
    <input id="search" type="text" placeholder="Поиск по последним 4 цифрам... (например, 1806)" autocomplete="off">
  </div>

  <div class="filters" id="filters">
    <button data-status="" class="active">Все</button>
    <button data-status="в пути">В пути</button>
    <button data-status="планируется">Планируется</button>
    <button data-status="завершено">Завершено</button>
  </div>

  <table id="table">
    <thead><tr>
      <th>Номер</th><th>Направление</th><th>Адрес</th><th>Вес</th><th>Статус</th><th>GPS</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">Ничего не найдено</div>
  <div class="pagination" id="pagination" style="display:none">
    <button id="prev">← Назад</button>
    <span id="page-info"></span>
    <button id="next">Вперёд →</button>
  </div>
</div>

<script>
const PAGE_SIZE = 20;
const state = { q: "", status: "", offset: 0, total: 0 };

const $ = s => document.querySelector(s);
const tbody = $("#tbody"), table = $("#table"), empty = $("#empty");
const pagination = $("#pagination"), pageInfo = $("#page-info");

function statusClass(s) {
  if (s === "в пути" || s === "планируется") return "in-transit";
  if (s === "завершено") return "delivered";
  if (!s) return "unknown";
  return "pending";
}

function mapsLink(lat, lng) {
  if (lat == null || lng == null) return "—";
  const url = `https://yandex.ru/maps/?pt=${lng},${lat}&z=12&l=map`;
  return `<a class="map-link" href="${url}" target="_blank" rel="noopener">${lat.toFixed(4)}, ${lng.toFixed(4)}</a>`;
}

function render(data) {
  state.total = data.total;
  const items = data.items;
  if (!items.length) {
    table.style.display = "none";
    empty.style.display = "block";
    pagination.style.display = "none";
    return;
  }
  table.style.display = "table";
  empty.style.display = "none";
  tbody.innerHTML = items.map(s => `
    <tr>
      <td>${s.order_id ?? ""}</td>
      <td>${s.direction ?? "—"}</td>
      <td>${s.address ?? "—"}</td>
      <td>${s.weight ? s.weight.toLocaleString("ru-RU") + " кг" : "—"}</td>
      <td><span class="status ${statusClass(s.status)}">${s.status || "—"}</span></td>
      <td>${mapsLink(s.current_lat, s.current_lng)}</td>
    </tr>`).join("");

  pagination.style.display = "flex";
  const page = Math.floor(state.offset / PAGE_SIZE) + 1;
  const pages = Math.max(1, Math.ceil(state.total / PAGE_SIZE));
  pageInfo.textContent = `Стр. ${page} из ${pages} (всего ${state.total})`;
  $("#prev").disabled = state.offset === 0;
  $("#next").disabled = state.offset + PAGE_SIZE >= state.total;
}

async function load() {
  const params = new URLSearchParams({
    limit: PAGE_SIZE, offset: state.offset,
  });
  if (state.q) params.set("q", state.q);
  if (state.status) params.set("status", state.status);

  const res = await fetch(`/api/shipments?${params}`);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    empty.textContent = err.detail || "Ошибка загрузки";
    empty.style.display = "block"; table.style.display = "none";
    return;
  }
  render(await res.json());
}

let timer = null;
$("#search").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const q = e.target.value.trim();
    if (q && (q.match(/\d/g) || []).length < 4) {
      empty.textContent = "Введите минимум 4 цифры";
      empty.style.display = "block"; table.style.display = "none";
      return;
    }
    state.q = q; state.offset = 0; load();
  }, 250);
});

$("#filters").addEventListener("click", e => {
  const btn = e.target.closest("button[data-status]");
  if (!btn) return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.status = btn.dataset.status;
  state.offset = 0;
  load();
});

$("#prev").addEventListener("click", () => { state.offset = Math.max(0, state.offset - PAGE_SIZE); load(); });
$("#next").addEventListener("click", () => { state.offset += PAGE_SIZE; load(); });

load();
</script>
</body>
</html>
